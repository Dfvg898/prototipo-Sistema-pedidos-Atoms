{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATOMS | Acceso administrativo</title>
    <link rel="icon" type="image/png" href="{% static 'img/atom.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/acceso.css' %}">
</head>
<body>
    <main class="contenedor-acceso">
        <section class="tarjeta-acceso">
            <div class="icono-acceso"><i class="bi bi-shield-lock"></i></div>
            <h1 class="h3 text-center fw-bold">ATOMS</h1>
            <p class="text-secondary text-center mb-4">Acceso al panel administrativo</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'login' %}" novalidate>
                {% csrf_token %}
                {% if request.GET.next %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                {% endif %}

                <div class="mb-3">
                    <label for="usuario" class="form-label">Correo electrónico</label>
                    <input
                        type="email"
                        name="correo"
                        id="usuario"
                        class="form-control"
                        placeholder="ejemplo@sandwichsatoms.cl"
                        value="{{ form.correo.value|default:'' }}"
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input
                        type="password"
                        name="password"
                        id="contrasena"
                        class="form-control"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <a href="{% url 'lista' %}" class="text-decoration-none small text-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Volver al catálogo público
                </a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
