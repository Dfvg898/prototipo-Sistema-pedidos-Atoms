{% extends "catalogo/base.html" %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="panel text-center py-5">
                <div class="display-4 text-danger mb-3">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h1 class="h3 fw-bold mb-2">Acceso Restringido (403)</h1>
                <p class="text-secondary mb-4">
                    Tu perfil actual (<strong>{{ user.get_rol_display }}</strong>) no cuenta con los permisos necesarios para acceder a esta sección.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'lista' %}" class="btn btn-primary">
                        <i class="bi bi-house-door me-1"></i> Volver al inicio
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
