{% extends  "catalogo/base.html" %}
{% load crispy_forms_tags %}


{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="panel">
                <h1 class="h3 mb-4">{% if object %}Editar{% else %}Nuevo{% endif %} producto</h1>

                {% if object.imagen %}
                <img src="{{ object.imagen.url }}" alt="{{ object.nombre }}"
                     class="rounded-3 mb-3" style="width: 8rem; height: 8rem; object-fit: cover;">
                {% endif %}

                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a href="{% url 'productos' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
